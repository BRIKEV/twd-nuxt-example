name: CI - twd tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Nuxt dev server
        run: |
          nohup npm run dev > nuxt.log 2>&1 &
          # Wait on both the home page and /todos. Nuxt dev compiles routes
          # on-demand on first request, so warming /todos here ensures it's
          # compiled before the tests run (otherwise the first visit races
          # the on-demand compile and times out).
          npx wait-on http://localhost:3000 http://localhost:3000/todos
        env:
          CI: true

      - name: Run TWD tests
        uses: BRIKEV/twd-cli/.github/actions/run@main
        with:
          contract-report: 'true'
